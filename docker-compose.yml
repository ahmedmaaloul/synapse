services:
  # ──────────────────────────────────────────────
  # Neo4j Graph Database (with APOC + vector index)
  # ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: synapse-neo4j
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-synapse_secret}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # FastAPI Backend (GraphRAG engine)
  # ──────────────────────────────────────────────
  backend:
    build:
      # Repo root, NOT ./backend — the image has to COPY LICENSE and NOTICE,
      # which live at the root. See .dockerignore for what's kept out.
      context: .
      dockerfile: backend/Dockerfile
    container_name: synapse-backend
    ports:
      # Override BACKEND_PORT in .env if 8000 is taken by another project.
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - ./backend:/app
      # Keep the container's virtualenv/site-packages, don't shadow with host.
      - /app/__pycache__
    # Hot-reload for local dev (the image's default CMD has no --reload).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Next.js Frontend
  # ──────────────────────────────────────────────
  frontend:
    build:
      # Repo root, NOT ./frontend — same LICENSE/NOTICE reason as the backend.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: synapse-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:

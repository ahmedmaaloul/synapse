# Fly.io deployment for the Synapse backend.
# Usage:
#   fly launch --no-deploy         # once, to create the app
#   fly secrets set GOOGLE_API_KEY=... NEO4J_URI=... NEO4J_PASSWORD=...
#   fly deploy
app = "synapse-backend"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_PROVIDER = "gemini"
  EMBEDDING_PROVIDER = "fastembed"
  EMBEDDING_DIM = "384"
  # Set CORS_ORIGINS via `fly secrets` to your deployed frontend origin.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"

[[vm]]
  # fastembed + onnxruntime want a little headroom.
  memory = "1gb"
  cpus = 1

# Fly.io deployment for the Synapse backend.
#
# IMPORTANT — run every command from the REPO ROOT, not from ./backend.
# `fly deploy` uses the directory containing fly.toml as the Docker build
# context by default, but backend/Dockerfile now builds from the repo root so
# it can `COPY LICENSE NOTICE` (required by NOTICE for container images).
# Deploying from ./backend would put those files outside the context and the
# build would fail. Pass --config/--dockerfile so the context stays the root:
#
#   fly launch --no-deploy --config backend/fly.toml
#   fly secrets set --config backend/fly.toml GOOGLE_API_KEY=... NEO4J_URI=... NEO4J_PASSWORD=...
#   fly deploy --config backend/fly.toml --dockerfile backend/Dockerfile
#
# See DEPLOYMENT.md § "Backend — Fly.io".
app = "synapse-backend"
primary_region = "cdg"

[build]
  # Relative to the build context (the repo root), not to this file.
  dockerfile = "backend/Dockerfile"

[env]
  LLM_PROVIDER = "gemini"
  EMBEDDING_PROVIDER = "fastembed"
  EMBEDDING_DIM = "384"
  # Set CORS_ORIGINS via `fly secrets` to your deployed frontend origin.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"

[[vm]]
  # fastembed + onnxruntime want a little headroom.
  memory = "1gb"
  cpus = 1

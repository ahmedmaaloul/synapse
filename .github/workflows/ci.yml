name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: lint + hermetic unit tests (no DB, no network, no LLM) ──
  backend:
    name: Backend · lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest (unit)
        run: pytest -q

  # ── Backend integration: real Neo4j service container ──
  backend-integration:
    name: Backend · integration (live Neo4j)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/synapse_secret
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Integration tests + retrieval eval
        env:
          SYNAPSE_IT: "1"
          EMBEDDING_PROVIDER: fastembed
          EMBEDDING_DIM: "384"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: synapse_secret
        run: |
          pytest tests/integration -v
          python -m eval.run_eval

  # ── Frontend: lint + typecheck + production build ──
  frontend:
    name: Frontend · lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint src
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Both Docker images build cleanly ──
  docker-build:
    name: Docker · build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Both images build from the REPO ROOT so they can COPY LICENSE and NOTICE
      # (the attribution terms require the notices to ship inside distributed
      # container images). The Dockerfiles therefore reference paths like
      # `backend/requirements.txt`; building with `./backend` as the context
      # cannot see them and fails. Keep this in sync with docker-compose.yml
      # and render.yaml, which use the same root context.
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t synapse-backend .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t synapse-frontend .
      - name: Verify the notices actually ship inside the image
        run: docker run --rm synapse-backend ls /app/LICENSE /app/NOTICE

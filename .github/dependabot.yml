# Dependabot configuration for Synapse
# Maintainer: Ahmed Maaloul <ahmed.maaloul@proton.me>
#
# IMPORTANT: the LangChain stack is pinned to the langchain-core 0.3.x line
# ("langchain-core>=0.3.33,<0.4" in backend/requirements.txt). That cap is
# load-bearing — provider SDKs otherwise pull langchain-core 1.x and break
# langchain / langchain-community / langchain-ollama. Major-version bumps of
# every langchain* package are therefore ignored below and must be done by hand,
# with `make test` and `make test-int` green before merging.
version: 2
updates:
  # ── Backend (pip) ────────────────────────────────────────
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      dev-tooling:
        patterns: ["pytest*", "ruff", "httpx", "anyio"]
    ignore:
      # The LangChain stack is EXCLUDED FROM AUTOMATION ENTIRELY — not just
      # major bumps. The effective ceiling is langchain-core 0.3.63, and it is
      # not expressible as a semver rule:
      #
      #   langchain==0.3.14 / langchain-community==0.3.14  ->  langsmith<0.3
      #   langchain-core>=0.3.64                           ->  langsmith>=0.3.45
      #
      # so even a PATCH bump of langchain-core past .63 makes the dependency set
      # unresolvable and every backend job fails at "Install dependencies".
      # Dependabot proved this by opening exactly that PR. Bumping this stack
      # means moving langchain/langchain-community together, by hand, with
      # `make test` and `make test-int` green before merge.
      - dependency-name: "langchain"
      - dependency-name: "langchain-core"
      - dependency-name: "langchain-community"
      - dependency-name: "langchain-ollama"
      - dependency-name: "langchain-openai"
      - dependency-name: "langchain-google-genai"
      - dependency-name: "langchain-anthropic"
      - dependency-name: "langsmith"

  # ── Frontend (npm) ───────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      react-next:
        patterns: ["react", "react-dom", "next", "eslint-config-next", "@types/react*"]
      types-and-linting:
        patterns: ["@types/*", "eslint*", "typescript"]
        update-types: ["minor", "patch"]

  # ── GitHub Actions ───────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
